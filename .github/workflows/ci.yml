name: CI - Pruebas Unitarias e Integración

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxis del proyecto
        run: |
          node --check server.js
          find src -name "*.js" -exec node --check {} +

      - name: Ejecutar pruebas unitarias y de integración con cobertura
        run: npm run test:coverage